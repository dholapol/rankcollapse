[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dholapol-rankcollapse"
version = "0.1.0"
description = "把候选项映射到类别上，算出LoRA 的秩崩溃的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dholapol" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://dholapol.github.io"
Repository = "https://github.com/dholapol/rankcollapse"
Issues = "https://github.com/dholapol/rankcollapse/issues"

[project.scripts]
rankcollapse = "rankcollapse:main"

[tool.setuptools]
py-modules = ["rankcollapse"]
